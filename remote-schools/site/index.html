<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote Schools: download the app</title>
<style>
  body{font:17px/1.6 system-ui,sans-serif;max-width:540px;margin:10vh auto;padding:0 22px;color:#12302f;background:#f6fbfb}
  h1{font-size:32px;margin:0 0 6px} p{color:#456} .row{display:grid;gap:12px;margin:22px 0}
  a.b{display:block;padding:15px 20px;border-radius:14px;background:#3fc5c8;color:#06302f;font-weight:700;text-decoration:none;text-align:center}
  a.b.off{background:#dde7e7;color:#789;pointer-events:none} small{color:#789}
</style></head>
<body>
<h1>Remote Schools</h1>
<p>Learn anywhere, even offline. <span id="notes"></span></p>
<div class="row">
  <a id="apk" class="b off" href="#">Android app (loading…)</a>
  <a id="exe" class="b off" href="#">Windows app (loading…)</a>
</div>
<p><small>After it downloads, open the file to install or update. On Android you may need to allow installs from your browser once.</small></p>
<script>
  // An old-style invitation link (?ref=CODE) goes to the join page, where the friend creates an account with the code already filled in.
  (function () { var m = /[?&#]ref=([^&#]+)/i.exec(location.search + location.hash); if (m) location.replace('join/?ref=' + m[1]); })();
  // Reads the same version.json the app reads, so these buttons always point at the newest installers.
  fetch('https://raw.githubusercontent.com/trebronwayne/trebronwayne.github.io/master/remote-schools/version.json?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById('notes').textContent = d.notes || '';
      [['apk', d.android, 'Android app'], ['exe', d.windows, 'Windows app']].forEach(function (x) {
        var a = document.getElementById(x[0]);
        if (x[1] && x[1].url) { a.href = x[1].url; a.textContent = 'Download ' + x[2] + ' ' + x[1].version; a.className = 'b'; }
        else a.textContent = x[2] + ' (not available yet)';
      });
    })
    .catch(function () { document.getElementById('apk').textContent = 'Could not load the download links. Try again.'; });
</script>
</body></html>
